name: Verificar integracion de casos de uso

on:
  push:
    branches:
      - integration/todos-los-cu-2026-11-23
      - main
      - refactor/solid-db-unica
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend
      - name: Compilar y ejecutar pruebas del backend
        run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend
      - name: Compilar Angular
        run: npm run build
        working-directory: frontend
